services:
  deid-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deid_gateway_service
    ports:
      - "8000:8000"
    environment:
      - DEID_ENV=production
      - DEID_HOST=0.0.0.0
      - DEID_PORT=8000
    volumes:
      - ./saved_models:/app/saved_models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
